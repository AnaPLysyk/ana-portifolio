openapi: 3.0.3
info:
  title: Ana Portfolio API
  description: >-
    ### O que é esta API?

    Esta API é a forma de consultar e alterar os dados usados pelo portfólio.
    Pelo Swagger você pode testar essas operações manualmente, sem precisar usar
    o frontend.


    ### Como testar um endpoint?

    1. Abra o endpoint.

    2. Clique em **Try it out**.

    3. Preencha os campos mostrados.

    4. Clique em **Execute**.

    5. Confira o código e a resposta retornada.


    ### O que significam GET, POST, PUT e DELETE?

    - **GET** = consultar dados.

    - **POST** = criar algo novo.

    - **PUT** = alterar dados existentes.

    - **DELETE** = remover.


    ### Login e token

    Algumas operações podem ser executadas por qualquer pessoa e outras exigem
    login. Depois do login, a API devolve um `accessToken`. Esse token funciona
    como uma identificação temporária para permitir alterações. Copie o valor e
    informe no botão **Authorize**.


    ### revision e expectedRevision

    `revision` é o número da versão atual dos dados.


    Antes de alterar alguma informação, faça o GET correspondente e veja o valor
    de `revision`.


    Ao salvar, envie esse mesmo número em `expectedRevision`.


    Isso evita que uma alteração sobrescreva outra feita depois.


    Exemplo curto:


    GET retornou: `revision: 4`


    Então no PUT, POST ou DELETE use: `expectedRevision: 4`


    Se retornar **409**, faça um novo GET porque os dados mudaram.


    ### Códigos de resposta

    - **200** = operação realizada.

    - **201** = item criado.

    - **204** = operação realizada sem conteúdo na resposta.

    - **400** = algum dado enviado está incorreto ou faltando.

    - **401** = precisa fazer login ou o token não é mais válido.

    - **404** = o item procurado não existe.

    - **409** = os dados mudaram desde o último GET ou, em criação, o ID já
    existe.

    - **503** = autenticação ainda não foi configurada no ambiente.
  version: 1.0.0
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    def-0:
      type: object
      description: Formato padrão de erro da API.
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Código do erro.
        message:
          type: string
          description: Explicação do erro.
        details:
          type: object
          additionalProperties: true
          description: Informações extras (opcional).
      title: ErrorResponse
    def-1:
      type: object
      description: Identidade e contatos exibidos no portfólio.
      required:
        - name
        - area
        - role
        - level
        - company
        - cep
        - address
        - location
        - email
        - whatsapp
        - github
        - linkedin
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Nome completo.
          example: Maria Exemplo
        area:
          type: string
          minLength: 1
          maxLength: 100
          description: Área de atuação.
          example: Qualidade de Software
        role:
          type: string
          minLength: 1
          maxLength: 80
          description: Cargo ou função.
          example: QA Analyst
        level:
          type: string
          minLength: 1
          maxLength: 40
          description: Nível de senioridade.
          example: Pleno
        company:
          type: string
          maxLength: 120
          description: Empresa atual (pode ficar vazio).
          example: Empresa Exemplo
        cep:
          type: string
          maxLength: 20
          description: CEP (pode ficar vazio).
          example: 00000-000
        address:
          type: string
          maxLength: 240
          description: Endereço (pode ficar vazio).
          example: Rua Exemplo, 123
        location:
          type: string
          minLength: 1
          maxLength: 160
          description: Cidade e estado.
          example: São Paulo, SP
        email:
          type: string
          format: email
          description: E-mail de contato.
          example: maria@exemplo.com
        whatsapp:
          type: string
          maxLength: 40
          description: WhatsApp com DDD (pode ficar vazio).
          example: +55 11 90000-0000
        github:
          type: string
          format: uri
          description: Link completo do GitHub.
          example: https://github.com/exemplo
        linkedin:
          type: string
          format: uri
          description: Link completo do LinkedIn.
          example: https://www.linkedin.com/in/exemplo
        photoUrl:
          type: string
          maxLength: 3000000
          description: "Foto (opcional): URL pública ou data URL de imagem. Para trocar só
            a foto, use PUT /api/v1/profile/photo."
          example: https://exemplo.com/foto.jpg
      title: Profile
      example:
        name: Maria Exemplo
        area: Qualidade de Software
        role: QA Analyst
        level: Pleno
        company: Empresa Exemplo
        cep: 00000-000
        address: Rua Exemplo, 123
        location: São Paulo, SP
        email: maria@exemplo.com
        whatsapp: +55 11 90000-0000
        github: https://github.com/exemplo
        linkedin: https://www.linkedin.com/in/exemplo
    def-2:
      type: object
      description: Texto principal da Home.
      required:
        - title
        - intro
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
          description: Título da Home.
          example: Qualidade de software com método e curiosidade
        intro:
          type: string
          minLength: 1
          maxLength: 3000
          description: Texto de apresentação.
          example: Sou QA e ajudo times a entregar produtos confiáveis.
      title: HeroContent
      example:
        title: Qualidade de software com método e curiosidade
        intro: Sou QA e ajudo times a entregar produtos confiáveis.
    def-3:
      type: object
      description: Texto da seção Sobre.
      required:
        - title
        - body
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
          description: Título da seção.
          example: Sobre mim
        body:
          type: string
          minLength: 1
          maxLength: 5000
          description: Texto completo da seção.
          example: Trabalho com testes funcionais, automação e análise de falhas.
      title: AboutContent
      example:
        title: Sobre mim
        body: Trabalho com testes funcionais, automação e análise de falhas.
    def-4:
      type: object
      description: Uma competência (habilidade) do portfólio.
      required:
        - id
        - title
        - description
        - tags
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 100
          description: 'Identificador único da competência, em texto simples (ex.:
            "automacao-testes"). Não pode repetir.'
          example: automacao-testes
        title:
          type: string
          minLength: 1
          maxLength: 160
          description: Nome da competência.
          example: Automação de testes
        description:
          type: string
          minLength: 1
          maxLength: 2000
          description: Explicação curta da competência.
          example: Criação de testes automatizados para web e API.
        tags:
          type: array
          maxItems: 50
          description: Palavras-chave ligadas à competência.
          items:
            type: string
            minLength: 1
            maxLength: 80
          example:
            - Playwright
            - TypeScript
      title: CompetencyItem
      example:
        id: automacao-testes
        title: Automação de testes
        description: Criação de testes automatizados para web e API.
        tags:
          - Playwright
          - TypeScript
    def-5:
      type: object
      description: Um projeto exibido no portfólio.
      required:
        - id
        - name
        - description
        - stack
        - href
        - status
        - visibility
        - linked
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 100
          description: 'Identificador único do projeto, em texto simples (ex.:
            "projeto-exemplo"). Não pode repetir.'
          example: projeto-exemplo
        name:
          type: string
          minLength: 1
          maxLength: 160
          description: Nome do projeto.
          example: Projeto Exemplo
        description:
          type: string
          minLength: 1
          maxLength: 3000
          description: O que o projeto faz.
          example: Aplicação de demonstração com testes automatizados.
        stack:
          type: array
          maxItems: 50
          description: Tecnologias usadas.
          items:
            type: string
            minLength: 1
            maxLength: 80
          example:
            - React
            - TypeScript
            - Fastify
        href:
          type: string
          format: uri
          description: Link do projeto (repositório ou site).
          example: https://github.com/exemplo/projeto-exemplo
        status:
          type: string
          minLength: 1
          maxLength: 80
          description: Situação do projeto.
          example: Em andamento
        visibility:
          type: string
          enum:
            - public
            - private
          description: "`public` aparece para todos; `private` fica restrito."
          example: public
        linked:
          type: boolean
          description: "`true` se o projeto tem link clicável."
          example: true
      title: Project
      example:
        id: projeto-exemplo
        name: Projeto Exemplo
        description: Aplicação de demonstração com testes automatizados.
        stack:
          - React
          - TypeScript
          - Fastify
        href: https://github.com/exemplo/projeto-exemplo
        status: Em andamento
        visibility: public
        linked: true
    def-6:
      type: object
      description: Um item da trajetória profissional.
      required:
        - id
        - period
        - company
        - role
        - summary
        - details
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 100
          description: 'Identificador único da experiência, em texto simples (ex.:
            "empresa-exemplo"). Não pode repetir.'
          example: empresa-exemplo
        period:
          type: string
          minLength: 1
          maxLength: 120
          description: Período em texto livre.
          example: 2024 — 2025
        company:
          type: string
          minLength: 1
          maxLength: 160
          description: Nome da empresa.
          example: Empresa Exemplo
        role:
          type: string
          minLength: 1
          maxLength: 160
          description: Cargo exercido.
          example: QA Analyst
        summary:
          type: string
          minLength: 1
          maxLength: 1600
          description: Resumo em uma frase.
          example: Atuação com testes funcionais e automação.
        details:
          type: string
          minLength: 1
          maxLength: 5000
          description: Detalhes do que foi feito.
          example: Execução de testes, análise de falhas e automação com Playwright.
      title: ExperienceItem
      example:
        id: empresa-exemplo
        period: 2024 — 2025
        company: Empresa Exemplo
        role: QA Analyst
        summary: Atuação com testes funcionais e automação.
        details: Execução de testes, análise de falhas e automação com Playwright.
    def-7:
      type: object
      description: Um curso ou formação.
      required:
        - id
        - title
        - institution
        - status
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 100
          description: 'Identificador único da formação, em texto simples (ex.:
            "curso-exemplo"). Não pode repetir.'
          example: curso-exemplo
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Nome do curso ou formação.
          example: Curso de Teste de Software
        institution:
          type: string
          minLength: 1
          maxLength: 160
          description: Instituição de ensino.
          example: Instituição Exemplo
        status:
          type: string
          minLength: 1
          maxLength: 80
          description: Situação.
          example: Concluído
        period:
          type: string
          maxLength: 120
          description: Período (opcional).
          example: "2023"
        description:
          type: string
          maxLength: 3000
          description: Descrição (opcional).
          example: Fundamentos de testes, técnicas e boas práticas.
        href:
          type: string
          format: uri
          description: Link do curso ou certificado (opcional).
          example: https://exemplo.com/curso
      title: EducationItem
      example:
        id: curso-exemplo
        title: Curso de Teste de Software
        institution: Instituição Exemplo
        status: Concluído
        period: "2023"
        description: Fundamentos de testes, técnicas e boas práticas.
        href: https://exemplo.com/curso
    def-8:
      type: object
      description: Um destaque ou conquista.
      required:
        - id
        - title
        - description
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 100
          description: 'Identificador único do destaque, em texto simples (ex.:
            "destaque-exemplo"). Não pode repetir.'
          example: destaque-exemplo
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Título do destaque.
          example: Redução de falhas em produção
        description:
          type: string
          minLength: 1
          maxLength: 3000
          description: Explicação do destaque.
          example: Testes automatizados reduziram erros após cada entrega.
        href:
          type: string
          format: uri
          description: Link relacionado (opcional).
          example: https://exemplo.com/case
        label:
          type: string
          maxLength: 100
          description: Texto do botão do link (opcional).
          example: Ver case
      title: HighlightItem
      example:
        id: destaque-exemplo
        title: Redução de falhas em produção
        description: Testes automatizados reduziram erros após cada entrega.
        href: https://exemplo.com/case
        label: Ver case
    def-9:
      type: object
      description: Aparência geral do portfólio.
      required:
        - theme
        - language
        - accent
        - intensity
        - spacing
        - pageFormat
        - footerText
      additionalProperties: false
      properties:
        theme:
          type: string
          enum:
            - dark
            - light
          description: "Tema: `dark` (escuro) ou `light` (claro)."
          example: dark
        language:
          type: string
          enum:
            - pt
            - en
            - es
          description: "Idioma: `pt`, `en` ou `es`."
          example: pt
        accent:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
          description: Cor de destaque em hexadecimal, com 6 dígitos.
          example: "#7C3AED"
        intensity:
          type: number
          minimum: 0
          maximum: 100
          description: Intensidade dos efeitos visuais (0 a 100).
          example: 60
        spacing:
          type: number
          minimum: 0
          maximum: 100
          description: Espaçamento entre elementos (0 a 100).
          example: 50
        pageFormat:
          type: string
          enum:
            - balanced
            - editorial
            - panoramic
          description: "Formato da página: `balanced`, `editorial` ou `panoramic`."
          example: balanced
        footerText:
          type: string
          maxLength: 500
          description: Texto do rodapé (pode ficar vazio).
          example: © 2025 Maria Exemplo
      title: Appearance
      example:
        theme: dark
        language: pt
        accent: "#7C3AED"
        intensity: 60
        spacing: 50
        pageFormat: balanced
        footerText: © 2025 Maria Exemplo
    def-10:
      type: object
      description: Ícone de uma seção.
      required:
        - icon
        - size
        - position
        - system
        - color
      additionalProperties: false
      properties:
        icon:
          type: string
          minLength: 1
          maxLength: 100
          description: Nome do ícone.
          example: briefcase
        size:
          type: number
          minimum: 8
          maximum: 256
          description: Tamanho em pixels (8 a 256).
          example: 24
        position:
          type: string
          enum:
            - before
            - after
          description: "Posição em relação ao título: `before` (antes) ou `after` (depois)."
          example: before
        system:
          type: boolean
          description: "`true` usa a cor do sistema; `false` usa a cor do campo `color`."
          example: true
        color:
          type: string
          maxLength: 40
          description: 'Cor do ícone (ex.: "#7C3AED").'
          example: "#7C3AED"
      title: SectionIconConfig
      example:
        icon: briefcase
        size: 24
        position: before
        system: true
        color: "#7C3AED"
    def-11:
      type: object
      description: Estilo de um texto. Todos os campos são opcionais.
      additionalProperties: false
      properties:
        fontFamily:
          type: string
          maxLength: 200
          description: Fonte.
          example: Inter, sans-serif
        fontSize:
          type: number
          minimum: 8
          maximum: 160
          description: Tamanho da fonte em pixels (8 a 160).
          example: 18
        fontWeight:
          type: number
          minimum: 100
          maximum: 900
          description: Peso da fonte (100 a 900). 400 = normal, 700 = negrito.
          example: 600
        color:
          type: string
          maxLength: 40
          description: Cor do texto.
          example: "#FFFFFF"
        textAlign:
          type: string
          enum:
            - left
            - center
            - right
          description: "Alinhamento: `left`, `center` ou `right`."
          example: left
        width:
          type: string
          maxLength: 30
          description: 'Largura (ex.: "80%").'
          example: 80%
        paddingInline:
          type: string
          maxLength: 30
          description: 'Margem interna lateral (ex.: "16px").'
          example: 16px
      title: TextStyle
      example:
        fontSize: 18
        fontWeight: 600
        color: "#FFFFFF"
        textAlign: left
    def-12:
      type: object
      description: Elemento livre posicionado na página.
      required:
        - id
        - section
        - type
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 100
          description: 'Identificador único do elemento, em texto simples (ex.:
            "badge-1"). Não pode repetir.'
          example: badge-1
        section:
          type: string
          minLength: 1
          maxLength: 100
          description: Seção onde o elemento aparece.
          example: hero
        type:
          type: string
          enum:
            - icon
            - badge
            - divider
            - layout
          description: "Tipo: `icon`, `badge`, `divider` ou `layout`."
          example: badge
        icon:
          type: string
          maxLength: 100
          description: Nome do ícone (para `icon`).
          example: star
        text:
          type: string
          maxLength: 500
          description: Texto exibido (para `badge`).
          example: Disponível
        x:
          type: number
          minimum: 0
          maximum: 100
          description: Posição horizontal em % (0 a 100).
          example: 10
        y:
          type: number
          minimum: 0
          maximum: 100
          description: Posição vertical em % (0 a 100).
          example: 20
        size:
          type: number
          minimum: 8
          maximum: 256
          description: Tamanho em pixels (8 a 256).
          example: 16
        color:
          type: string
          maxLength: 40
          description: Cor do elemento.
          example: "#7C3AED"
        useSystemColor:
          type: boolean
          description: "`true` usa a cor de destaque do portfólio."
          example: true
        layout:
          type: string
          maxLength: 100
          description: Nome do layout (para `layout`).
          example: balanced
      title: FreeElement
      example:
        id: badge-1
        section: hero
        type: badge
        text: Disponível
        x: 10
        y: 20
        size: 16
        useSystemColor: true
    def-13:
      type: object
      description: Um assunto que o assistente sabe responder.
      required:
        - id
        - title
        - category
        - keywords
        - content
        - enabled
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 100
          description: 'Identificador único do contexto, em texto simples (ex.:
            "contato"). Não pode repetir.'
          example: contato
        title:
          type: string
          minLength: 1
          maxLength: 160
          description: Título do assunto.
          example: Como entrar em contato
        category:
          type: string
          minLength: 1
          maxLength: 100
          description: Categoria.
          example: Contato
        keywords:
          type: array
          maxItems: 50
          description: Palavras que ativam este assunto.
          items:
            type: string
            minLength: 1
            maxLength: 80
          example:
            - contato
            - email
        content:
          type: string
          minLength: 1
          maxLength: 5000
          description: Texto usado na resposta.
          example: O contato pode ser feito pelo e-mail ou LinkedIn do portfólio.
        enabled:
          type: boolean
          description: "`true` = o assistente usa este assunto."
          example: true
      title: AssistantContext
      example:
        id: contato
        title: Como entrar em contato
        category: Contato
        keywords:
          - contato
          - email
        content: O contato pode ser feito pelo e-mail ou LinkedIn do portfólio.
        enabled: true
    def-14:
      type: object
      description: Configuração do assistente do portfólio.
      required:
        - greeting
        - suggestions
        - contexts
      additionalProperties: false
      properties:
        greeting:
          type: string
          minLength: 1
          maxLength: 1200
          description: Mensagem de boas-vindas.
          example: Olá! Pergunte sobre projetos, experiência ou contato.
        suggestions:
          type: array
          maxItems: 20
          description: Perguntas sugeridas ao visitante.
          items:
            type: string
            minLength: 1
            maxLength: 120
          example:
            - Quais são os projetos?
            - Como entrar em contato?
        contexts:
          type: array
          maxItems: 100
          description: Assuntos que o assistente conhece.
          items:
            $ref: "#/components/schemas/def-13"
      title: AssistantConfig
      example:
        greeting: Olá! Pergunte sobre projetos, experiência ou contato.
        suggestions:
          - Quais são os projetos?
          - Como entrar em contato?
        contexts:
          - id: contato
            title: Como entrar em contato
            category: Contato
            keywords:
              - contato
              - email
            content: O contato pode ser feito pelo e-mail ou LinkedIn do portfólio.
            enabled: true
    def-15:
      type: object
      description: Posição na tela, em porcentagem.
      required:
        - x
        - y
      additionalProperties: false
      properties:
        x:
          type: number
          minimum: 0
          maximum: 100
          description: Horizontal (0 a 100).
          example: 85
        y:
          type: number
          minimum: 0
          maximum: 100
          description: Vertical (0 a 100).
          example: 80
      title: Position
    def-16:
      type: object
      description: Estado visual do editor (layouts, ícones, estilos e elementos).
      required:
        - sectionLayouts
        - sectionIcons
        - textStyles
        - freeElements
        - assistantLayout
      additionalProperties: false
      properties:
        sectionLayouts:
          type: object
          description: Layout de cada seção. Chave = nome da seção.
          additionalProperties:
            type: string
            maxLength: 100
          example:
            hero: balanced
            about: editorial
        sectionIcons:
          type: object
          description: Ícone de cada seção. Chave = nome da seção.
          additionalProperties:
            $ref: "#/components/schemas/def-10"
        textStyles:
          type: object
          description: Estilo de cada texto editável. Chave = nome do texto.
          additionalProperties:
            $ref: "#/components/schemas/def-11"
        freeElements:
          type: array
          maxItems: 500
          description: Elementos livres da página.
          items:
            $ref: "#/components/schemas/def-12"
        assistantLayout:
          type: object
          description: Posição do robô e do botão de chamada (CTA).
          required:
            - robot
            - cta
          additionalProperties: false
          properties:
            robot:
              $ref: "#/components/schemas/def-15"
            cta:
              $ref: "#/components/schemas/def-15"
      title: EditorState
      example:
        sectionLayouts:
          hero: balanced
          about: editorial
        sectionIcons:
          experience:
            icon: briefcase
            size: 24
            position: before
            system: true
