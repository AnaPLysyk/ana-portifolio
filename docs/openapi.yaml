openapi: 3.1.0
info:
  title: Ana Portfolio API
  version: 1.0.0
  description: >
    API do portfólio profissional. Leitura pública, edição autenticada,
    controle de revisão, configuração visual e assistente.

servers:
  - url: http://localhost:3333
    description: Desenvolvimento local

tags:
  - name: Health
  - name: Auth
  - name: Portfolio
  - name: Profile
  - name: Content
  - name: Projects
  - name: Experience
  - name: Appearance
  - name: Editor
  - name: Assistant

paths:
  /api/v1/health:
    get:
      tags: [Health]
      summary: Verifica disponibilidade da API
      responses:
        '200':
          description: API disponível

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Autentica o editor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              additionalProperties: false
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login realizado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Autenticação não configurada

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Retorna sessão autenticada
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sessão válida
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Encerra sessão no cliente
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Token descartado pelo cliente
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/portfolio:
    get:
      tags: [Portfolio]
      summary: Retorna documento completo publicado
      responses:
        '200':
          description: Snapshot atual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioSnapshot'
    put:
      tags: [Portfolio]
      summary: Salva documento completo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortfolioWrite'
      responses:
        '200':
          description: Documento salvo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioSnapshot'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/profile:
    get:
      tags: [Profile]
      summary: Retorna perfil público
      responses:
        '200':
          description: Perfil atual
    put:
      tags: [Profile]
      summary: Atualiza perfil
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/ProfileWrite'
      responses:
        '200':
          description: Perfil atualizado
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/profile/photo:
    put:
      tags: [Profile]
      summary: Atualiza foto
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision, dataUrl]
              additionalProperties: false
              properties:
                expectedRevision:
                  type: integer
                  minimum: 1
                dataUrl:
                  type: string
      responses:
        '200':
          description: Foto atualizada
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/hero:
    get:
      tags: [Content]
      summary: Retorna Home
      responses:
        '200':
          description: Conteúdo atual
    put:
      tags: [Content]
      summary: Atualiza Home
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/HeroWrite'
      responses:
        '200':
          description: Home atualizada
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/about:
    get:
      tags: [Content]
      summary: Retorna Sobre
      responses:
        '200':
          description: Conteúdo atual
    put:
      tags: [Content]
      summary: Atualiza Sobre
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/AboutWrite'
      responses:
        '200':
          description: Sobre atualizado
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/competencies:
    get:
      tags: [Content]
      summary: Lista competências
      responses:
        '200':
          description: Competências atuais
    put:
      tags: [Content]
      summary: Substitui competências
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/CompetenciesWrite'
      responses:
        '200':
          description: Competências salvas
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/education:
    get:
      tags: [Content]
      summary: Lista formação e cursos
      responses:
        '200':
          description: Formação atual
    put:
      tags: [Content]
      summary: Substitui formação e cursos
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/EducationWrite'
      responses:
        '200':
          description: Formação salva
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/highlights:
    get:
      tags: [Content]
      summary: Lista destaques e conquistas
      responses:
        '200':
          description: Destaques atuais
    put:
      tags: [Content]
      summary: Substitui destaques e conquistas
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/HighlightsWrite'
      responses:
        '200':
          description: Destaques salvos
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/content-blocks:
    get:
      tags: [Content]
      summary: Retorna textos editáveis por chave
      responses:
        '200':
          description: Textos atuais
    put:
      tags: [Content]
      summary: Salva textos editáveis por chave
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/ContentBlocksWrite'
      responses:
        '200':
          description: Textos salvos
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/projects:
    get:
      tags: [Projects]
      summary: Lista projetos
      responses:
        '200':
          description: Projetos atuais
    post:
      tags: [Projects]
      summary: Cria projeto
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/ProjectWrite'
      responses:
        '201':
          description: Projeto criado
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/projects/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Projects]
      summary: Retorna projeto
      responses:
        '200':
          description: Projeto encontrado
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Projects]
      summary: Atualiza projeto
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/ProjectWrite'
      responses:
        '200':
          description: Projeto atualizado
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Projects]
      summary: Remove projeto
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ExpectedRevision'
      responses:
        '200':
          description: Projeto removido
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/projects/order:
    put:
      tags: [Projects]
      summary: Reordena projetos
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/OrderWrite'
      responses:
        '200':
          description: Projetos reordenados
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/experience:
    get:
      tags: [Experience]
      summary: Lista trajetória
      responses:
        '200':
          description: Experiência atual
    post:
      tags: [Experience]
      summary: Cria item de experiência
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/ExperienceWrite'
      responses:
        '201':
          description: Experiência criada
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/experience/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Experience]
      summary: Retorna item de experiência
      responses:
        '200':
          description: Experiência encontrada
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Experience]
      summary: Atualiza item de experiência
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/ExperienceWrite'
      responses:
        '200':
          description: Experiência atualizada
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Experience]
      summary: Remove item de experiência
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ExpectedRevision'
      responses:
        '200':
          description: Experiência removida
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/experience/order:
    put:
      tags: [Experience]
      summary: Reordena trajetória
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/OrderWrite'
      responses:
        '200':
          description: Trajetória reordenada
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/appearance:
    get:
      tags: [Appearance]
      summary: Retorna aparência
      responses:
        '200':
          description: Aparência atual
    put:
      tags: [Appearance]
      summary: Atualiza aparência
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/AppearanceWrite'
      responses:
        '200':
          description: Aparência atualizada
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/editor:
    get:
      tags: [Editor]
      summary: Retorna estado visual completo
      responses:
        '200':
          description: Estado atual
    put:
      tags: [Editor]
      summary: Atualiza estado visual completo
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/EditorWrite'
      responses:
        '200':
          description: Editor atualizado
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/editor/layouts:
    put:
      tags: [Editor]
      summary: Atualiza layouts por seção
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/RecordWrite'
      responses:
        '200':
          description: Layouts salvos
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/editor/icons:
    put:
      tags: [Editor]
      summary: Atualiza ícones por seção
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Ícones salvos
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/editor/text-styles:
    put:
      tags: [Editor]
      summary: Atualiza estilos de texto
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Estilos salvos
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/editor/elements:
    put:
      tags: [Editor]
      summary: Atualiza elementos livres
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Elementos salvos
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/editor/assistant-layout:
    put:
      tags: [Editor]
      summary: Atualiza posições do robô e CTA
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Layout do assistente salvo
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/assistant/config:
    get:
      tags: [Assistant]
      summary: Retorna configuração/contextos
      responses:
        '200':
          description: Configuração atual
    put:
      tags: [Assistant]
      summary: Atualiza configuração/contextos
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/AssistantWrite'
      responses:
        '200':
          description: Configuração salva
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/assistant/messages:
    post:
      tags: [Assistant]
      summary: Envia mensagem ao assistente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              additionalProperties: false
              properties:
                message:
                  type: string
                  minLength: 1
                  maxLength: 1000
      responses:
        '200':
          description: Resposta do assistente
        '400':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ResourceId:
      in: path
      name: id
      required: true
      schema:
        type: string
        minLength: 1
    ExpectedRevision:
      in: query
      name: expectedRevision
      required: true
      schema:
        type: integer
        minimum: 1

  responses:
    ValidationError:
      description: Request fora do contrato
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Token ausente/inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflito de revisão ou recurso
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  requestBodies:
    ProfileWrite:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/RevisionBase'
              - type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Profile'
    HeroWrite:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/RevisionBase'
              - type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Hero'
    AboutWrite:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/RevisionBase'
              - type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/About'
    CompetenciesWrite:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/RevisionBase'
              - type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Competency'
    EducationWrite:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/RevisionBase'
              - type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Education'
    HighlightsWrite:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/RevisionBase'
              - type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Highlight'
    ContentBlocksWrite:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/RevisionBase'
              - type: object
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties:
                      type: string
    ProjectWrite:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/RevisionBase'
              - type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
    ExperienceWrite:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/RevisionBase'
              - type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Experience'
    OrderWrite:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [expectedRevision, ids]
            additionalProperties: false
            properties:
              expectedRevision:
                type: integer
                minimum: 1
              ids:
                type: array
                minItems: 1
                uniqueItems: true
                items:
                  type: string
    AppearanceWrite:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/RevisionBase'
              - type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Appearance'
    EditorWrite:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/RevisionBase'
              - type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/EditorState'
    AssistantWrite:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/RevisionBase'
              - type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AssistantConfig'
    RecordWrite:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/RevisionBase'
              - type: object
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: true

  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true

    RevisionBase:
      type: object
      required: [expectedRevision]
      properties:
        expectedRevision:
          type: integer
          minimum: 1

    Profile:
      type: object
      required:
        [name, area, role, level, company, cep, address, location, email, whatsapp, github, linkedin]
      additionalProperties: false
      properties:
        name: { type: string }
        area: { type: string }
        role: { type: string }
        level: { type: string }
        company: { type: string }
        cep: { type: string }
        address: { type: string }
        location: { type: string }
        email: { type: string, format: email }
        whatsapp: { type: string }
        github: { type: string, format: uri }
        linkedin: { type: string, format: uri }
        photoUrl: { type: string }

    Hero:
      type: object
      required: [title, intro]
      properties:
        title: { type: string }
        intro: { type: string }

    About:
      type: object
      required: [title, body]
      properties:
        title: { type: string }
        body: { type: string }

    Competency:
      type: object
      required: [id, title, description, tags]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        tags:
          type: array
          items: { type: string }

    Project:
      type: object
      required: [id, name, description, stack, href, status, visibility, linked]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        stack:
          type: array
          items: { type: string }
        href: { type: string, format: uri }
        status: { type: string }
        visibility:
          type: string
          enum: [public, private]
        linked: { type: boolean }

    Experience:
      type: object
      required: [id, period, company, role, summary, details]
      properties:
        id: { type: string }
        period: { type: string }
        company: { type: string }
        role: { type: string }
        summary: { type: string }
        details: { type: string }

    Education:
      type: object
      required: [id, title, institution, status]
      properties:
        id: { type: string }
        title: { type: string }
        institution: { type: string }
        status: { type: string }
        period: { type: string }
        description: { type: string }
        href: { type: string, format: uri }

    Highlight:
      type: object
      required: [id, title, description]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        href: { type: string, format: uri }
        label: { type: string }

    Appearance:
      type: object
      required: [theme, language, accent, intensity, spacing, pageFormat, footerText]
      properties:
        theme:
          type: string
          enum: [dark, light]
        language:
          type: string
          enum: [pt, en, es]
        accent: { type: string }
        intensity: { type: number }
        spacing: { type: number }
        pageFormat:
          type: string
          enum: [balanced, editorial, panoramic]
        footerText: { type: string }

    AssistantContext:
      type: object
      required: [id, title, category, keywords, content, enabled]
      properties:
        id: { type: string }
        title: { type: string }
        category: { type: string }
        keywords:
          type: array
          items: { type: string }
        content: { type: string }
        enabled: { type: boolean }

    AssistantConfig:
      type: object
      required: [greeting, suggestions, contexts]
      properties:
        greeting: { type: string }
        suggestions:
          type: array
          items: { type: string }
        contexts:
          type: array
          items:
            $ref: '#/components/schemas/AssistantContext'

    EditorState:
      type: object
      required: [sectionLayouts, sectionIcons, textStyles, freeElements, assistantLayout]
      properties:
        sectionLayouts:
          type: object
          additionalProperties: { type: string }
        sectionIcons:
          type: object
          additionalProperties: true
        textStyles:
          type: object
          additionalProperties: true
        freeElements:
          type: array
          items:
            type: object
            additionalProperties: true
        assistantLayout:
          type: object
          additionalProperties: true

    PortfolioDocument:
      type: object
      required:
        [profile, hero, about, competencies, projects, experience, education, highlights, contentBlocks, appearance, assistant, editor]
      properties:
        profile:
          $ref: '#/components/schemas/Profile'
        hero:
          $ref: '#/components/schemas/Hero'
        about:
          $ref: '#/components/schemas/About'
        competencies:
          type: array
          items:
            $ref: '#/components/schemas/Competency'
        projects:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        experience:
          type: array
          items:
            $ref: '#/components/schemas/Experience'
        education:
          type: array
          items:
            $ref: '#/components/schemas/Education'
        highlights:
          type: array
          items:
            $ref: '#/components/schemas/Highlight'
        contentBlocks:
          type: object
          additionalProperties:
            type: string
        appearance:
          $ref: '#/components/schemas/Appearance'
        assistant:
          $ref: '#/components/schemas/AssistantConfig'
        editor:
          $ref: '#/components/schemas/EditorState'

    PortfolioSnapshot:
      type: object
      required: [revision, updatedAt, data]
      properties:
        revision:
          type: integer
        updatedAt:
          type: string
          format: date-time
        data:
          $ref: '#/components/schemas/PortfolioDocument'

    PortfolioWrite:
      type: object
      required: [expectedRevision, data]
      additionalProperties: false
      properties:
        expectedRevision:
          type: integer
          minimum: 1
        data:
          $ref: '#/components/schemas/PortfolioDocument'
