paths:
  /api/v1/health:
    get:
      summary: Verifica se a API está no ar
      tags:
        - Health
      description: >-
        🔓 **Não precisa de login.**


        Teste rápido: se responder `status: "ok"`, a API está funcionando. Bom
        primeiro passo para quem está começando.
      responses:
        "200":
          description: API disponível.
          content:
            application/json:
              schema:
                description: API disponível.
                type: object
                required:
                  - status
                  - service
                  - timestamp
                properties:
                  status:
                    type: string
                    description: Sempre "ok" quando a API está no ar.
                    enum:
                      - ok
                    example: ok
                  service:
                    type: string
                    description: Nome do serviço.
                    example: ana-portfolio-api
                  timestamp:
                    type: string
                    format: date-time
                    description: Hora atual do servidor.
                    example: 2025-01-15T12:00:00.000Z
  /api/v1/auth/login:
    post:
      summary: Faz login e recebe o token
      tags:
        - Auth
      description: >-
        🔓 **Não precisa de login.**


        Envie usuário e senha do editor. Copie o `accessToken` retornado e cole
        no botão **Authorize** (topo da página) para liberar os endpoints 🔒.
        Cole só o token, sem a palavra "Bearer".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              additionalProperties: false
              properties:
                username:
                  type: string
                  minLength: 1
                  description: Usuário do editor (definido em ADMIN_USERNAME).
                  example: ana
                password:
                  type: string
                  minLength: 1
                  description: Senha do editor (definida em ADMIN_PASSWORD).
                  example: sua-senha
            example:
              username: ana
              password: sua-senha
      responses:
        "200":
          description: Login feito. Use o `accessToken` no botão Authorize.
          content:
            application/json:
              schema:
                description: Login feito. Use o `accessToken` no botão Authorize.
                type: object
                required:
                  - accessToken
                  - tokenType
                  - expiresIn
                properties:
                  accessToken:
                    type: string
                    description: Token JWT. Cole no botão Authorize.
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.exemplo.assinatura
                  tokenType:
                    type: string
                    description: Tipo do token (sempre "Bearer").
                    enum:
                      - Bearer
                    example: Bearer
                  expiresIn:
                    type: string
                    description: Tempo de validade do token.
                    example: 2h
        "400":
          description: Algum dado enviado está incorreto ou faltando.
          content:
            application/json:
              schema:
                description: Algum dado enviado está incorreto ou faltando.
                type: object
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Código do erro.
                    example: VALIDATION_ERROR
                  message:
                    type: string
                    description: Explicação do erro.
                    example: A requisição não atende ao contrato da API.
                  details:
                    type: object
                    additionalProperties: true
                    description: Informações extras (opcional).
              example:
                code: VALIDATION_ERROR
                message: A requisição não atende ao contrato da API.
        "401":
          description: Usuário ou senha incorretos.
          content:
            application/json:
              schema:
                description: Usuário ou senha incorretos.
                type: object
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    example: INVALID_CREDENTIALS
                  message:
                    type: string
                    example: Usuário ou senha inválidos.
        "503":
          description: Login ainda não configurado no servidor.
          content:
            application/json:
              schema:
                description: Login ainda não configurado no servidor.
                type: object
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    example: AUTH_NOT_CONFIGURED
                  message:
                    type: string
                    example: Configure ADMIN_USERNAME, ADMIN_PASSWORD e JWT_SECRET antes de usar a
                      autenticação.
  /api/v1/auth/me:
    get:
      summary: Mostra quem está logado
      tags:
        - Auth
      description: >-
        🔒 **Precisa de login.**


        Serve para testar se o token está valendo: retorna o usuário dono do
        token.
      security: &a1
        - bearerAuth: []
      responses:
        "200":
          description: Token válido.
          content:
            application/json:
              schema:
                description: Token válido.
                type: object
                required:
                  - username
                properties:
                  username:
                    type: string
                    description: Usuário logado.
                    example: ana
        "401":
          description: Precisa fazer login ou o token não é mais válido.
          content:
            application/json:
              schema:
                description: Precisa fazer login ou o token não é mais válido.
                type: object
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Código do erro.
                    example: UNAUTHORIZED
                  message:
                    type: string
                    description: Explicação do erro.
                    example: Autenticação obrigatória ou token inválido.
                  details:
                    type: object
                    additionalProperties: true
                    description: Informações extras (opcional).
              example:
                code: UNAUTHORIZED
                message: Autenticação obrigatória ou token inválido.
  /api/v1/auth/logout:
    post:
      summary: Encerra a sessão
      tags:
        - Auth
      description: >-
        🔒 **Precisa de login.**


        Não tem corpo. O token não é invalidado no servidor: depois de chamar,
        descarte o token (no Swagger, use **Logout** no botão Authorize).
      security: *a1
      responses:
        "204":
          description: Sessão encerrada (resposta vazia).
        "401":
          description: Precisa fazer login ou o token não é mais válido.
          content:
            application/json:
              schema:
                description: Precisa fazer login ou o token não é mais válido.
                type: object
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Código do erro.
                    example: UNAUTHORIZED
                  message:
                    type: string
                    description: Explicação do erro.
                    example: Autenticação obrigatória ou token inválido.
                  details:
                    type: object
                    additionalProperties: true
                    description: Informações extras (opcional).
              example:
                code: UNAUTHORIZED
                message: Autenticação obrigatória ou token inválido.
  /api/v1/portfolio:
    get:
      summary: Retorna o portfólio completo
      tags:
        - Portfolio
      description: >-
        🔓 **Não precisa de login.**


        Devolve todos os dados de uma vez: perfil, textos, projetos,
        experiência, aparência, assistente e editor. Também traz `revision`,
        usado nas escritas.
      responses:
        "200":
          description: Portfólio completo com `revision` e `updatedAt`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-18"
    put:
      summary: Salva o portfólio completo
      tags:
        - Portfolio
      description: >-
        🔒 **Precisa de login.**


        Substitui **todos** os dados de uma vez. Dica: faça `GET
        /api/v1/portfolio`, altere o que precisar e envie o resultado em `data`.
        Para mudar só uma parte, prefira os endpoints específicos (profile,
        projects etc.).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Versão atual + portfólio completo.
              required:
                - expectedRevision
                - data
              additionalProperties: false
              properties:
                expectedRevision:
                  type: integer
                  minimum: 1
                  description: Use a `revision` retornada pelo último GET.
                  example: 4
                data:
                  $ref: "#/components/schemas/def-17"
        description: Versão atual + portfólio completo.
      security: *a1
      responses:
        "200":
          description: Alteração realizada. A resposta contém o portfólio completo e a
            nova `revision`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-18"
        "400":
          description: Algum dado enviado está incorreto ou faltando.
          content:
            application/json:
              schema:
                description: Algum dado enviado está incorreto ou faltando.
                type: object
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Código do erro.
                    example: VALIDATION_ERROR
                  message:
                    type: string
                    description: Explicação do erro.
                    example: A requisição não atende ao contrato da API.
                  details:
                    type: object
                    additionalProperties: true
                    description: Informações extras (opcional).
              example:
                code: VALIDATION_ERROR
                message: A requisição não atende ao contrato da API.
        "401":
          description: Precisa fazer login ou o token não é mais válido.
          content:
            application/json:
              schema:
                description: Precisa fazer login ou o token não é mais válido.
                type: object
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Código do erro.
                    example: UNAUTHORIZED
                  message:
                    type: string
                    description: Explicação do erro.
                    example: Autenticação obrigatória ou token inválido.
                  details:
                    type: object
                    additionalProperties: true
                    description: Informações extras (opcional).
              example:
                code: UNAUTHORIZED
                message: Autenticação obrigatória ou token inválido.
        "409":
          description: Os dados mudaram desde o último GET. Faça um novo GET e tente de
            novo.
          content:
            application/json:
              schema:
                description: Os dados mudaram desde o último GET. Faça um novo GET e tente de
                  novo.
                type: object
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Código do erro.
                    example: REVISION_CONFLICT
                  message:
                    type: string
                    description: Explicação do erro.
                    example: O portfólio foi alterado depois que esta edição começou. Recarregue a
                      revisão atual antes de salvar.
                  details:
                    type: object
                    additionalProperties: true
                    description: Informações extras (opcional).
                    example:
                      expectedRevision: 3
                      currentRevision: 4
              example:
                code: REVISION_CONFLICT
                message: O portfólio foi alterado depois que esta edição começou. Recarregue a
                  revisão atual antes de salvar.
                details:
                  expectedRevision: 3
                  currentRevision: 4
