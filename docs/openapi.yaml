                $ref: "#/components/schemas/def-18"
        "400":
          description: Algum dado enviado está incorreto ou faltando.
          content:
            application/json:
              schema:
                description: Algum dado enviado está incorreto ou faltando.
                type: object
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Código do erro.
                    example: VALIDATION_ERROR
                  message:
                    type: string
                    description: Explicação do erro.
                    example: A requisição não atende ao contrato da API.
                  details:
                    type: object
                    additionalProperties: true
                    description: Informações extras (opcional).
              example:
                code: VALIDATION_ERROR
                message: A requisição não atende ao contrato da API.
        "401":
          description: Precisa fazer login ou o token não é mais válido.
          content:
            application/json:
              schema:
                description: Precisa fazer login ou o token não é mais válido.
                type: object
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Código do erro.
                    example: UNAUTHORIZED
                  message:
                    type: string
                    description: Explicação do erro.
                    example: Autenticação obrigatória ou token inválido.
                  details:
                    type: object
                    additionalProperties: true
                    description: Informações extras (opcional).
              example:
                code: UNAUTHORIZED
                message: Autenticação obrigatória ou token inválido.
        "409":
          description: Os dados mudaram desde o último GET. Faça um novo GET e tente de
            novo.
          content:
            application/json:
              schema:
                description: Os dados mudaram desde o último GET. Faça um novo GET e tente de
                  novo.
                type: object
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Código do erro.
                    example: REVISION_CONFLICT
                  message:
                    type: string
                    description: Explicação do erro.
                    example: O portfólio foi alterado depois que esta edição começou. Recarregue a
                      revisão atual antes de salvar.
                  details:
                    type: object
                    additionalProperties: true
                    description: Informações extras (opcional).
                    example:
                      expectedRevision: 3
                      currentRevision: 4
              example:
                code: REVISION_CONFLICT
                message: O portfólio foi alterado depois que esta edição começou. Recarregue a
                  revisão atual antes de salvar.
                details:
                  expectedRevision: 3
                  currentRevision: 4
  /api/v1/assistant/messages:
    post:
      summary: Faz uma pergunta ao assistente
      tags:
        - Assistant
      description: >-
        🔓 **Não precisa de login.**


        Envie uma pergunta e receba uma resposta baseada no conteúdo do
        portfólio. Nesta versão a resposta não usa IA externa: vem dos textos e
        contextos salvos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              additionalProperties: false
              properties:
                message:
                  type: string
                  minLength: 1
                  maxLength: 1000
                  description: Sua pergunta (até 1000 caracteres).
                  example: Quais são os projetos?
            example:
              message: Quais são os projetos?
      responses:
        "200":
          description: Resposta do assistente.
          content:
            application/json:
              schema:
                description: Resposta do assistente.
                type: object
                required:
                  - reply
                  - source
                properties:
                  reply:
                    type: string
                    description: Texto da resposta.
                    example: O portfólio tem o Projeto Exemplo, feito com React e Fastify.
                  source:
                    type: string
                    description: De onde veio a resposta (sempre "portfolio").
                    enum:
                      - portfolio
                    example: portfolio
        "400":
          description: Algum dado enviado está incorreto ou faltando.
          content:
            application/json:
              schema:
                description: Algum dado enviado está incorreto ou faltando.
                type: object
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Código do erro.
                    example: VALIDATION_ERROR
                  message:
                    type: string
                    description: Explicação do erro.
                    example: A requisição não atende ao contrato da API.
                  details:
                    type: object
                    additionalProperties: true
                    description: Informações extras (opcional).
              example:
                code: VALIDATION_ERROR
                message: A requisição não atende ao contrato da API.
